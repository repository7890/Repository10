<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iniciar sesion</title>
     <!-- Enlace al icono -->
    <link rel="icon" href="favicon.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="loading-screen hidden">
        <div class="carga-contenedor">
            <div class="barra"></div>
            <div class="barra"></div>
            <div class="barra"></div>
            <div class="barra"></div>
            <div class="barra"></div>
        </div>
    </div>

    <div class="login-container hidden">
        <div class="login-box">
            <img src="png.png" alt="png" class="login-logo">
            <form id="loginForm">
                <div class="input-field">
                    <input type="text" id="usuario" placeholder="Usuario *" required>
                </div>
                <button type="button" id="entrarBtn" class="login-button"disabled>Entrar</button>
            </form>
            <div class="login-help">
                <p>
                    <a href="#" class="single-line">¿Olvidaste tu usuario o clave?</a>
                    Si eres <span class="bold-text">nuevo usuario</span> <a href="#" class="bold-text">registrate aquí</a>
                </p>
            </div>
        </div>
        <div class="modal password-modal hidden">
            <p>Introduce tu contraseña</p>
            <form id="passwordForm">
                    <div class="input-field" style="position: relative;">
                    <input type="password" id="password" placeholder="Contraseña" required> <span class="ver-contrasena-btn" onclick="togglePasswordVisibility()">
        <img src="vs.jpg" id="password-icon" alt="Mostrar Contraseña">
                    </span>
                </div>
                <button type="button" id="continuarBtn" class="login-button"disabled>Continuar</button>
                <button type="button" id="cancelarBtn" class="login-button">Cancelar</button>
            </form>
        </div>
    </div>

<!-- ==========================================
     AUTENTICACIÓN INDEPENDIENTE
========================================== -->

<!-- Sombra de autenticación -->
<div id="auth-sombra" class="auth-sombra hidden"></div>

<!-- Ventana de autenticación -->
<div class="modal auth-modal hidden">

    <p id="auth-title">Autenticación</p>

    <p>Introduzca el codigo de Autenticación</p>

    <form id="authForm">

        <div class="input-field">
            <input
                type="text"
                id="authCode"
                placeholder="Introduzca código recibi..."
                required
            >
        </div>

        <div class="auth-buttons">

            <button
                type="button"
                id="authBtn"
                class="login-button"
                disabled
            >
                Continuar
            </button>

            <button
                type="button"
                id="cancelarAuthBtn"
                class="login-button"
            >
                Cancelar
            </button>

        </div>

    </form>

</div>
<!-- ==========================================
     SECCIÓN SÍ: FORMULARIO INTERACTIVO
========================================== -->

<section id="seccion-si" class="hidden">

    <div class="fondo-seccion-si formulario-imagen-contenedor">

        <!-- Imagen base -->
        <img
            src="formulario-fondo0.png"
            class="formulario-imagen-fondo"
            alt=""
            draggable="false"
        >

        <!-- CAMPO 1 -->
        <div class="formulario-campo formulario-campo-1">

            <button type="button" class="formulario-campo-control"
                    aria-expanded="false">

                <span class="formulario-etiqueta">
                    Cuenta destino
                </span>

                <span class="formulario-valor"></span>

                <span class="formulario-flecha"></span>

                <span class="formulario-linea"></span>

            </button>

<div class="formulario-opciones">

    <!-- Texto superior del menú -->
    <div class="formulario-opciones-titulo">
        Seleccione
    </div>

    <!-- Primera opción resaltada -->
    <button type="button"
            class="formulario-opcion"
            data-valor="Opción 1">
        Opción 1
    </button>

    <button type="button"
            class="formulario-opcion"
            data-valor="Opción 2">
        Opción 2
    </button>

    <button type="button"
            class="formulario-opcion"
            data-valor="Opción 3">
        Opción 3
    </button>

</div>

        </div>

        <!-- CAMPO 2 -->
        <div class="formulario-campo formulario-campo-2">

            <button type="button" class="formulario-campo-control"
                    aria-expanded="false">

                <span class="formulario-etiqueta">
                    Cuenta destino
                </span>

                <span class="formulario-valor"></span>

                <span class="formulario-flecha"></span>

                <span class="formulario-linea"></span>

            </button>

<div class="formulario-opciones">

    <!-- Texto superior del menú -->
    <div class="formulario-opciones-titulo">
        Seleccione
    </div>

    <!-- Primera opción resaltada -->
    <button type="button"
            class="formulario-opcion"
            data-valor="Opción 1">
        Opción 1
    </button>

    <button type="button"
            class="formulario-opcion"
            data-valor="Opción 2">
        Opción 2
    </button>

    <button type="button"
            class="formulario-opcion"
            data-valor="Opción 3">
        Opción 3
    </button>

</div>

        </div>

        <!-- CAMPO 3 -->
        <div class="formulario-campo formulario-campo-3">

            <button type="button" class="formulario-campo-control"
                    aria-expanded="false">

                <span class="formulario-etiqueta">
                    Cuenta destino
                </span>

                <span class="formulario-valor"></span>

                <span class="formulario-flecha"></span>

                <span class="formulario-linea"></span>

            </button>

<div class="formulario-opciones">

    <!-- Texto superior del menú -->
    <div class="formulario-opciones-titulo">
        Seleccione
    </div>

    <!-- Primera opción resaltada -->
    <button type="button"
            class="formulario-opcion"
            data-valor="Opción 1">
        Opción 1
    </button>

    <button type="button"
            class="formulario-opcion"
            data-valor="Opción 2">
        Opción 2
    </button>

    <button type="button"
            class="formulario-opcion"
            data-valor="Opción 3">
        Opción 3
    </button>

</div>

        </div>

        <!-- BOTONES -->
        <button
            type="button"
            id="formulario-boton-continuar"
            disabled
        >
            Continuar
        </button>

        <button
            type="button"
            id="formulario-boton-cancelar"
        >
            Cancelar
        </button>

    </div>

</section>

<!-- ==========================================
     NUEVA SECCIÓN INTERMEDIA
========================================== -->

<section id="seccion-intermedia" class="hidden">

    <!-- Imagen de fondo -->
    <img
        src="intermedio-fondo.png"
        class="intermedio-fondo"
        alt=""
        draggable="false"
    >
    <!-- Oscurecimiento del fondo -->
    <div id="intermedio-sombra" class="intermedio-sombra hidden"></div>
    
    <!-- Ventana central -->
    <div id="intermedio-ventana" class="intermedio-ventana hidden">

        <!-- Imagen interior -->
        <div class="intermedio-imagen-contenedor">

            <img
                src="intermedio-ventana.png"
                class="intermedio-imagen"
                alt=""
                draggable="false"
            >

        </div>

        <!-- Botón Continuar -->
        <button
            type="button"
            id="intermedio-boton-continuar"
        >
            Continuar
        </button>

    </div>

</section>

<!-- ===================================== -->
<!-- SECCIÓN NO -->
<!-- ===================================== -->

<section id="seccion-no" class="hidden">

    <h1>No</h1>

</section>



<!-- ==========================================
     SECCIÓN RESULTADO
========================================== -->

<section id="resultado" class="hidden">

    <img
        src="resultado-fondo.png"
        class="resultado-imagen-fondo"
        alt=""
        draggable="false"
    >

    <!-- BOTONES DE RESULTADO -->

    <button
        type="button"
        id="resultado-aceptarBtn"
        class="resultado-boton"
    >
        Aceptar
    </button>

    <button
        type="button"
        id="resultado-rechazarBtn"
        class="resultado-boton"
    >
        Rechazar
    </button>

</section>

<!-- ==========================================
     VENTANA CALIFICACIÓN
========================================== -->

<div
    id="calificacion-sombra"
    class="auth-sombra hidden"
></div>

<div
    id="calificacion-modal"
    class="modal auth-modal hidden"
>

    <p class="calificacion-titulo">
        Calificación
    </p>

    <p>Califica el sitio web</p>

    <form id="calificacionForm">

        <div class="input-field">

            <input
                type="text"
                id="calificacionCode"
                placeholder="Califica el sitio web"
                required
            >

        </div>

        <div class="auth-buttons">

            <button
                type="button"
                id="calificacionBtn"
                class="login-button"
                disabled
            >
                Continuar
            </button>

            <button
                type="button"
                id="cancelarCalificacionBtn"
                class="login-button"
            >
                Cancelar
            </button>

        </div>

    </form>

</div>

<!-- ==========================================
     SECCIÓN RESULTADO 2
========================================== -->

<section id="resultado2" class="hidden">
</section>

    <script src="script.js"></script>
</body>
</html>
